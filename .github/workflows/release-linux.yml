name: release-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run package:linux

      - name: checksums
        working-directory: dist
        run: |
          for asset in *.AppImage *_amd64.deb; do
            sha256sum "$asset" > "$asset.sha256"
          done
          sha256sum *.AppImage *_amd64.deb > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mxwl-linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*_amd64.deb
            dist/*_amd64.deb.sha256
            dist/SHA256SUMS

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run package:mac

      - name: checksums
        working-directory: dist
        run: |
          for asset in *-mac.zip; do
            shasum -a 256 "$asset" > "$asset.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mxwl-mac
          path: |
            dist/*-mac.zip
            dist/*-mac.zip.sha256

  release:
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mxwl-*
          merge-multiple: true
          path: dist
      - name: combined checksums
        working-directory: dist
        run: sha256sum *.AppImage *_amd64.deb *-mac.zip > SHA256SUMS
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*_amd64.deb
            dist/*_amd64.deb.sha256
            dist/*-mac.zip
            dist/*-mac.zip.sha256
            dist/SHA256SUMS
