appId: com.mxwl.editor
productName: mxwl
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asar: true
afterPack: scripts/after-pack.js
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: "kerry <kerry@joinzipper.com>"
mac:
  target:
    - zip
  category: public.app-category.developer-tools
  identity: null
  # A platform `files` replaces the top-level one rather than adding to it, so the
  # two patterns above have to be repeated here or the mac app packs the whole repo.
  # The exclusions drop trees holding binaries compiled for whatever machine ran the
  # build: node-pty ships NAPI prebuilds it falls back to, and ssh2's two native
  # addons are both optional (it has pure-JS paths), so a cross-built mac app is
  # better off without an unloadable Linux .so.
  files:
    - out/**/*
    - package.json
    - "!node_modules/node-pty/build/**"
    - "!node_modules/cpu-features/**"
    - "!node_modules/ssh2/lib/protocol/crypto/build/**"
win:
  target:
    - portable
  signAndEditExecutable: false
